name: build-and-release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - run: cargo fmt --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          tar -czf "alias-tips-rs-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" alias-tips-rs
          sha256sum "alias-tips-rs-${{ matrix.target }}.tar.gz" \
            > "alias-tips-rs-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: alias-tips-rs-${{ matrix.target }}
          path: |
            alias-tips-rs-${{ matrix.target }}.tar.gz
            alias-tips-rs-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
