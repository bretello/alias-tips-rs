name: build-and-release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - run: cargo fmt --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
        include:
          # macOS builds run natively on macos runners; both darwin targets
          # cross-compile from either arch
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          tar -czf "alias-tips-rs-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" alias-tips-rs
          if command -v sha256sum >/dev/null; then
            sha256sum "alias-tips-rs-${{ matrix.target }}.tar.gz" \
              > "alias-tips-rs-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "alias-tips-rs-${{ matrix.target }}.tar.gz" \
              > "alias-tips-rs-${{ matrix.target }}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: alias-tips-rs-${{ matrix.target }}
          path: |
            alias-tips-rs-${{ matrix.target }}.tar.gz
            alias-tips-rs-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$REPO" \
            --generate-notes \
            dist/*
